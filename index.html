<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Pilih Kotak - I Love You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #ffb3d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5em;
            color: #ff1493;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
        }

        .subtitle {
            font-size: 1.2em;
            margin-bottom: 30px;
            color: #cc0066;
        }

        .game-area {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 600px;
        }

        .instruction {
            color: #ff1493;
            font-size: 1.1em;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .bomb-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 10px;
            margin-bottom: 30px;
        }

        .bomb-cell {
            width: 100px;
            height: 100px;
            background: #ffe6f0;
            border: 3px solid #ff69b4;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 3em;
            text-align: center;
            vertical-align: middle;
            position: relative;
        }

        .bomb-cell:hover:not(.revealed) {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255,105,180,0.4);
            background: #ffc0e0;
        }

        .bomb-cell.revealed {
            cursor: not-allowed;
            background: white;
            border-color: #ffb3d9;
        }

        .bomb-cell.clicked {
            animation: revealAnimation 0.6s ease-out;
        }

        .bomb-cell.safe {
            background: #d4f4dd;
            border-color: #4CAF50;
        }

        .bomb-cell.bomb-hit {
            background: #ffcccc;
            border-color: #ff6666;
        }

        @keyframes revealAnimation {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }

        .result {
            font-size: 2.5em;
            font-weight: bold;
            color: #ff1493;
            margin-top: 20px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0);
            transition: all 0.5s ease-out;
        }

        .result.show {
            opacity: 1;
            transform: scale(1);
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        .result-subtitle {
            font-size: 0.4em;
            color: #ff69b4;
            margin-top: 10px;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.08);
            }
        }

        .reset-btn {
            background: #ff1493;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255,20,147,0.3);
            display: none;
        }

        .reset-btn.show {
            display: inline-block;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,20,147,0.5);
            background: #cc0066;
        }

        .reset-btn:active {
            transform: translateY(0);
        }

        .heart-float {
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .click-counter {
            font-size: 1em;
            color: #ff69b4;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💗 Game Pilih Kotak 💗</h1>
        <p class="subtitle">Pilih kotak dengan hati-hati!</p>

        <div class="game-area">
            <p class="instruction">Klik kotak di bawah ini untuk membuka kejutan:</p>

            <div class="click-counter" id="counter">Klik: 0/4</div>

            <table class="bomb-table">
                <tr>
                    <td class="bomb-cell" data-index="0" onclick="revealCell(this)"></td>
                    <td class="bomb-cell" data-index="1" onclick="revealCell(this)"></td>
                    <td class="bomb-cell" data-index="2" onclick="revealCell(this)"></td>
                    <td class="bomb-cell" data-index="3" onclick="revealCell(this)"></td>
                </tr>
                <tr>
                    <td class="bomb-cell" data-index="4" onclick="revealCell(this)"></td>
                    <td class="bomb-cell" data-index="5" onclick="revealCell(this)"></td>
                    <td class="bomb-cell" data-index="6" onclick="revealCell(this)"></td>
                    <td class="bomb-cell" data-index="7" onclick="revealCell(this)"></td>
                </tr>
                <tr>
                    <td class="bomb-cell" data-index="8" onclick="revealCell(this)"></td>
                    <td class="bomb-cell" data-index="9" onclick="revealCell(this)"></td>
                    <td class="bomb-cell" data-index="10" onclick="revealCell(this)"></td>
                    <td class="bomb-cell" data-index="11" onclick="revealCell(this)"></td>
                </tr>
            </table>

            <div class="result" id="result"></div>

            <button class="reset-btn" id="resetBtn" onclick="resetGame()">Main Lagi</button>
        </div>
    </div>

    <script>
        let gameEnded = false;
        let clickCount = 0;
        let bombPositions = [];

        function initGame() {
            // Generate 3-5 random bomb positions
            const numBombs = Math.floor(Math.random() * 3) + 3; // 3-5 bombs
            bombPositions = [];

            while (bombPositions.length < numBombs) {
                const pos = Math.floor(Math.random() * 12);
                if (!bombPositions.includes(pos)) {
                    bombPositions.push(pos);
                }
            }
        }

        function revealCell(cell) {
            if (gameEnded || cell.classList.contains('revealed')) {
                return;
            }

            cell.classList.add('clicked', 'revealed');
            const index = parseInt(cell.getAttribute('data-index'));

            // Check if bomb
            if (bombPositions.includes(index)) {
                // Hit bomb
                cell.innerHTML = '💣';
                cell.classList.add('bomb-hit');
                endGame(true);
            } else {
                // Safe
                cell.innerHTML = '✓';
                cell.classList.add('safe');
                clickCount++;

                document.getElementById('counter').textContent = `Klik: ${clickCount}/4`;

                // Check if reached 4 clicks
                if (clickCount >= 4) {
                    endGame(false);
                }
            }
        }

        function endGame(hitBomb) {
            gameEnded = true;

            // Disable all cells
            const allCells = document.querySelectorAll('.bomb-cell');
            allCells.forEach(c => {
                c.classList.add('revealed');
            });

            // Show result after animation
            setTimeout(() => {
                const resultDiv = document.getElementById('result');

                if (hitBomb) {
                    resultDiv.innerHTML = `
                        <div>
                            <span class="heart-float">💕</span>
                            I LOVE YOU SYARIFAH
                            <span class="heart-float">💕</span>
                        </div>
                        <div class="result-subtitle">Kena bom? Tidak apa-apa ❤️</div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div>
                            <span class="heart-float">💕</span>
                            I LOVE YOU SYARIFAH
                            <span class="heart-float">💕</span>
                        </div>
                        <div class="result-subtitle">Selamat! Kamu berhasil 4x tanpa bom! ❤️</div>
                    `;
                }

                resultDiv.classList.add('show');
                document.getElementById('resetBtn').classList.add('show');
            }, 600);
        }

        function resetGame() {
            gameEnded = false;
            clickCount = 0;

            // Reset counter
            document.getElementById('counter').textContent = 'Klik: 0/4';

            // Reset all cells
            const allCells = document.querySelectorAll('.bomb-cell');
            allCells.forEach(cell => {
                cell.classList.remove('revealed', 'clicked', 'safe', 'bomb-hit');
                cell.innerHTML = '';
            });

            // Hide result
            const resultDiv = document.getElementById('result');
            resultDiv.classList.remove('show');
            resultDiv.innerHTML = '';

            // Hide reset button
            document.getElementById('resetBtn').classList.remove('show');

            // Generate new bombs
            initGame();
        }

        // Initialize game on load
        initGame();
    </script>
</body>
</html>
